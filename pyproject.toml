[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One installed package, so every module resolves by name no matter which
# directory it sits in or which directory it was launched from. There used to
# be six top-level namespaces here -- seismolib plus one per family -- which
# meant `detection` and `features` were importable names owned by this repo,
# and a cross-family import read like a third-party one.
[tool.hatch.build.targets.wheel]
packages = ["src/sismokaos"]

[project.scripts]
# One front door for scripts/. Dispatches by path rather than importing them as
# a package, because afad_imap spawns afad_campaign as a subprocess by path.
sk = "sismokaos.cli:main"

[project]
name = "model-cnn-lstm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.1",
    "obspy>=1.5.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.1",
    "pywavelets>=1.9.0",
    # Imported at module scope by src/sismokaos/detection/stead_to_ponly_mseed.py and
    # seisbench_stead_baseline.py, so tests/test_stead_conversion.py cannot even
    # be collected without it. Was undeclared until 2026-08-31 and only worked
    # where h5py happened to be installed already -- a fresh checkout could not
    # run the suite at all.
    "h5py>=3.11.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
# python-docx is a dev dependency, not a runtime one: `sk docx` is a
# reporting convenience, but leaving it uninstalled meant its tests skipped
# everywhere, and that is how `sk docx` shipped unable to run at all and
# with a loop that hung on the repo's own report.
dev = ["pytest>=8.0", "python-docx>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every failure this suite is meant to catch is a quiet one -- a floor reported
# below chance, a checkpoint from the wrong arm -- so warnings are not noise
# here and a summary of them is printed on every run.
addopts = "-ra --strict-markers"
