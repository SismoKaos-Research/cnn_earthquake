[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `seismolib` is installed (editable) so scripts resolve it no matter which
# directory they sit in. Without this, imports would only work while every
# script lived together in src/ and was run from there -- which is exactly the
# flat layout this package exists to replace.
[tool.hatch.build.targets.wheel]
packages = [
    "src/seismolib",
    # The family packages are registered too, so the handful of legitimate
    # cross-family imports resolve by name rather than by which directory the
    # script was launched from.
    "src/forecasting",
    "src/detection",
    "src/magnitude",
    "src/groundmotion",
    "src/features",
]

[project]
name = "model-cnn-lstm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.1",
    "obspy>=1.5.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.1",
    "pywavelets>=1.9.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every failure this suite is meant to catch is a quiet one -- a floor reported
# below chance, a checkpoint from the wrong arm -- so warnings are not noise
# here and a summary of them is printed on every run.
addopts = "-ra --strict-markers"
